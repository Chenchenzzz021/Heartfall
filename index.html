<title>Hearthfall</title>

<style>
/* Layout: full-screen pixel world, wooden HUD strip on top, parchment sheets for every menu */
:root{
  --wood:#2b1d14; --wood-2:#3d2a1c; --wood-edge:#5c4128;
  --parch:#efdfb8; --parch-2:#e2cc98; --ink:#2a1c10; --ink-soft:#6b5236;
  --gold:#f2c14e; --gold-deep:#b9871d; --blood:#a8322a; --leaf:#4f8a2f; --sky:#2f5f8f;
  --display:"Grenze Gotisch","Palatino Linotype",Georgia,serif;
  --body:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--wood);color:var(--parch);font-family:var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;background:#1b140e}
button{font-family:var(--body);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(var(--wood) 70%,rgba(43,29,20,0));pointer-events:none;z-index:5}
.chip{display:flex;align-items:center;gap:6px;background:var(--wood-2);border:2px solid var(--wood-edge);border-radius:6px;padding:4px 9px;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;box-shadow:0 2px 0 #0006}
.chip b{color:var(--gold);font-size:15px}
.chip .lbl{color:#cdb98f;font-size:12px}
.ico{width:16px;height:16px;flex:none;image-rendering:pixelated}
#hDay{font-family:var(--display);font-size:18px;color:var(--gold)}
.ebar{width:70px;height:9px;background:#120c08;border:1px solid #000;border-radius:2px;overflow:hidden}
.ebar i{display:block;height:100%;background:linear-gradient(#9be36a,#4f8a2f);transition:width .3s}

#tasks{position:fixed;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(250px,calc(100vw - 24px));
  background:var(--parch);color:var(--ink);border:3px solid var(--wood-edge);border-radius:8px;box-shadow:0 4px 0 #0007;z-index:5;font-size:13px}
#tasks header{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;border-bottom:2px dashed #c9ad77;font-family:var(--display);font-size:18px;color:var(--ink)}
#tasks header button{background:none;border:0;color:var(--ink-soft);font-size:12px;padding:2px 4px}
#tasks ul{list-style:none;margin:0;padding:6px 10px 8px;display:grid;gap:5px}
#tasks li{display:grid;grid-template-columns:16px 1fr auto;gap:6px;align-items:start;line-height:1.3}
#tasks li .box{width:12px;height:12px;border:2px solid var(--ink-soft);border-radius:2px;margin-top:2px}
#tasks li.done{color:#8a7454;text-decoration:line-through}
#tasks li.done .box{background:var(--leaf);border-color:var(--leaf)}
#tasks li small{display:block;color:var(--ink-soft);text-decoration:none}
#tasks li .rw{color:var(--gold-deep);font-weight:700;font-variant-numeric:tabular-nums}
#tasks .foot{padding:0 10px 8px;color:var(--ink-soft);font-size:12px}
#tasks.min ul,#tasks.min .foot{display:none}

#dock{position:fixed;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:5}
.btn{background:var(--wood-2);color:var(--parch);border:2px solid var(--wood-edge);border-radius:7px;padding:8px 12px;font-size:13px;font-weight:600;box-shadow:0 3px 0 #000a}
.btn:hover{background:var(--wood-edge)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #000a}
.btn.gold{background:var(--gold);color:var(--ink);border-color:var(--gold-deep)}
.btn.gold:hover{background:#ffd56e}
.btn:disabled{opacity:.45;cursor:not-allowed}
#act{min-width:150px;font-size:15px;padding:12px 16px}
#act kbd{display:inline-block;background:var(--ink);color:var(--gold);border-radius:4px;padding:0 6px;margin-right:6px;font-family:var(--body)}
.row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}

#toast{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--parch);color:var(--ink);border:2px solid var(--wood-edge);border-radius:6px;padding:7px 14px;font-size:14px;font-weight:600;z-index:20;box-shadow:0 3px 0 #0007;max-width:calc(100vw - 32px);text-align:center;transition:opacity .3s}

#modal{position:fixed;inset:0;background:rgba(15,9,5,.72);display:flex;align-items:center;justify-content:center;z-index:30;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--parch);color:var(--ink);border:4px solid var(--wood-edge);border-radius:10px;box-shadow:0 8px 0 #000a,inset 0 0 40px #c9a86655;
  width:min(760px,100%);max-height:100%;overflow:auto;padding:18px 20px;position:relative}
.sheet h1,.sheet h2{font-family:var(--display);font-weight:800;margin:0 0 4px;color:var(--ink);text-wrap:balance;line-height:1.05}
.sheet h1{font-size:44px;letter-spacing:.5px}
.sheet h2{font-size:30px}
.sheet h3{font-family:var(--display);font-size:21px;margin:0;color:var(--ink)}
.sheet p{margin:6px 0;line-height:1.5;max-width:65ch}
.sub{color:var(--ink-soft);font-size:13px}
.x{position:absolute;top:8px;right:10px;background:none;border:0;font-size:26px;color:var(--ink-soft);line-height:1}
.tabs{display:flex;gap:4px;border-bottom:3px solid var(--wood-edge);margin:10px 0 12px;flex-wrap:wrap}
.tabs button{background:var(--parch-2);color:var(--ink);border:2px solid var(--wood-edge);border-bottom:0;border-radius:6px 6px 0 0;padding:7px 14px;font-weight:700;font-size:14px}
.tabs button[aria-selected=true]{background:var(--wood-edge);color:var(--parch)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.card{background:#f7ecd0;border:2px solid #c9ad77;border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.card .top{display:flex;align-items:center;gap:10px}
.card canvas{image-rendering:pixelated;flex:none}
.lvl{font-size:12px;font-weight:700;color:var(--parch);background:var(--ink-soft);border-radius:10px;padding:1px 8px;white-space:nowrap}
.lvl.max{background:var(--gold-deep)}
.card .eff{font-size:13px;line-height:1.4;color:var(--ink)}
.card .eff em{font-style:normal;color:var(--leaf);font-weight:700}
.card .btn{margin-top:auto}
.card .btn,.sheet .btn{color:var(--parch)}
.sheet .btn.gold{color:var(--ink)}
.stat{display:flex;gap:14px;flex-wrap:wrap;background:var(--parch-2);border-radius:6px;padding:8px 12px;font-size:14px;margin-bottom:10px;font-variant-numeric:tabular-nums}
.stat b{color:var(--blood)}
.profs{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:12px 0}
.prof{border:3px solid #c9ad77;background:#f7ecd0;border-radius:8px;padding:10px;text-align:left;color:var(--ink);display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.prof[aria-pressed=true]{border-color:var(--blood);background:#fff3d6;box-shadow:0 0 0 2px var(--gold)}
.prof b{font-family:var(--display);font-size:22px}
.prof span{font-size:12.5px;line-height:1.35;color:var(--ink-soft)}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.field input{font:inherit;font-size:15px;padding:7px 10px;border:2px solid var(--wood-edge);border-radius:6px;background:#fffaf0;color:var(--ink);min-width:0;flex:1 1 180px}
.mapbox{position:relative;width:100%;aspect-ratio:16/10;border:3px solid var(--wood-edge);border-radius:6px;overflow:hidden;max-width:100%}
.mapbox canvas,.mapbox svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px}
.node i{display:block;width:26px;height:30px;clip-path:polygon(0 0,100% 0,100% 60%,50% 100%,0 60%);background:#8d8270;border:0;box-shadow:inset 0 0 0 3px #0003}
.node.own i{background:linear-gradient(#3d7fc4,#244f80)}
.node.can i{background:linear-gradient(#d0453a,#7d1f19);animation:pulse 1.4s infinite}
.node.sel i{outline:3px solid var(--gold);outline-offset:2px}
.node span{font-size:11px;font-weight:700;background:#f7ecd0e6;color:var(--ink);border-radius:4px;padding:0 4px;white-space:nowrap}
@keyframes pulse{50%{filter:brightness(1.35)}}
.rinfo{margin-top:10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.rinfo .stat{margin:0;flex:1 1 300px}
.log{font-size:14px;line-height:1.6;margin:8px 0 12px;padding-left:18px}
.log li.bad{color:var(--blood)}
.log li.good{color:#2f6a1b}
.center{text-align:center}
.help{font-size:13px;color:var(--ink-soft);margin-top:8px}
@media (max-width:640px){
  .sheet h1{font-size:34px}
  .chip{font-size:12px;padding:3px 7px}
  .chip .lbl{display:none}
  #act{min-width:0;font-size:14px;padding:10px 12px}
  #tasks{top:calc(100px + env(safe-area-inset-top,0px));bottom:auto;width:min(250px,calc(100vw - 24px));font-size:12px}
  #tasks header{font-size:16px;padding:4px 8px}
  .btn{padding:7px 9px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){.node.can i{animation:none}}

/* nút đóng bảng: tròn, to, đặt ở góc ngoài vùng cuộn */
.sw{position:relative;width:min(760px,100%);max-height:calc(100% - 8px);display:flex;margin-top:8px}.sw>.sheet{width:100%;max-height:100%;padding-top:22px}
.sheet>h2:first-child,.sheet>h1:first-child{padding-right:30px}
.x{position:absolute;top:-14px;right:-10px;margin:0;width:42px;height:42px;border-radius:50%;background:var(--blood);color:#fff;border:3px solid #3b2a2a;font-size:34px;font-weight:700;line-height:1;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #0007;cursor:pointer;z-index:3;padding:0 0 3px}
.x:hover{filter:brightness(1.15)}.x:active{transform:translateY(2px);box-shadow:0 1px 0 #0007}
/* bảng việc gọn */
#tasks header{font-size:15px!important;padding:5px 9px!important}
#tasks header .cnt{font-family:var(--body);font-size:12px;color:var(--gold-deep);margin-left:4px}
#tasks header button{font-size:12px;font-weight:600;text-decoration:underline}
#tasks ul{padding:5px 9px 7px!important;gap:4px!important}
#tasks li{grid-template-columns:13px 1fr auto!important;gap:6px!important;font-size:13px;line-height:1.25!important}
#tasks li .box{width:11px!important;height:11px!important}
#tasks .tn{min-width:0}#tasks{width:min(215px,calc(100vw - 24px))!important}#tasks li[data-ti]:not(.done){cursor:pointer;border-radius:4px}#tasks li[data-ti]:not(.done):hover{background:rgba(242,193,78,.25)}#tasks li .rw{font-size:12px}
#tasks li small{font-size:11px;white-space:normal}
#tasks .foot{padding:0 9px 7px!important;font-size:12px}
@media (max-width:640px){#tasks{width:min(200px,calc(100vw - 24px))!important}#tasks li{font-size:12px;grid-template-columns:12px 1fr auto!important}#tasks .tn{overflow-wrap:anywhere}#tasks li small{white-space:normal;overflow:visible;font-size:11px}#tasks header{font-size:14px!important}.x{width:44px;height:44px}}
/* giao diện trận đánh */
#fight{position:fixed;inset:0;pointer-events:none;z-index:7;font-family:var(--body)}
#fight .ftop{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(620px,calc(100vw - 16px));background:rgba(27,20,14,.82);border:2px solid var(--wood-edge);border-radius:8px;padding:6px 10px;color:#f7ecd0}
#fight .fname{font-family:var(--display);font-size:20px;text-align:center;color:var(--gold);line-height:1.1}
#fight .fbars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
#fight .fb span{font-size:12px;font-weight:600}
#fight .bar{height:10px;background:#120c08;border:1px solid #000;border-radius:3px;overflow:hidden;margin-top:2px}
#fight .bar i{display:block;height:100%;transition:width .2s}
#fight .bar.ally i{background:#5fd17a}#fight .bar.foe i{background:#d9473a}#fight .bar.boss i{background:linear-gradient(#e0675a,#a8322a)}#fight .bar.hero i{background:#ffd23f}
#fight .fboss{margin-top:6px;font-size:13px;font-weight:700;color:#ffb3a8}#fight .fboss .bar{height:14px}
#fight .fbot{position:absolute;left:0;right:0;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:flex-end;justify-content:center;flex-wrap:wrap;padding:0 8px}
#fight .fhero{pointer-events:auto;display:flex;gap:8px;align-items:center;background:rgba(27,20,14,.82);border:2px solid var(--wood-edge);border-radius:8px;padding:6px 10px 6px 6px;color:#f7ecd0;min-width:220px}
#fight .fhero img{width:52px;height:52px;image-rendering:pixelated;background:#3a5f8a;border-radius:6px}
#fight .fhero b{font-size:14px}#fight .fhero small{display:block;font-size:11px;color:#d8c9a6;margin-top:2px}#fight .fhero .bar{width:150px}
#fight .fsk{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#fight .fsk button{pointer-events:auto;position:relative;overflow:hidden;min-width:84px;height:52px;border-radius:8px;border:2px solid #3b2a2a;background:var(--gold);color:var(--ink);font:700 13px var(--body);box-shadow:0 3px 0 #0007;cursor:pointer;padding:4px 8px}
#fight .fsk button span{position:relative;z-index:1}
#fight .fsk button em{position:absolute;right:4px;top:2px;font-size:10px;font-style:normal;opacity:.7;z-index:1}
#fight .fsk button i{position:absolute;left:0;right:0;bottom:0;background:rgba(20,12,6,.6);height:0}
#fight .fsk button:disabled{filter:grayscale(.6);cursor:default}
#fight #fSpeed,#fight #fRetreat{background:#efe0bd}#fight #fRetreat{background:#e7b8a8}
@media (max-width:640px){#fight .fname{font-size:17px}#fight .fsk button{min-width:70px;height:46px;font-size:12px}#fight .fhero{min-width:0;width:100%}#fight .fhero .bar{width:100%}#fight .fhero>div{flex:1}}

.eqi.t1{border-color:#3b8fe0;background-color:#1d2c40}.eqi.t2{border-color:#a35ee8;background-color:#2c1f3d}.eqi.t3{border-color:#f08a1c;background-color:#3d2a14;box-shadow:0 0 6px #f08a1c88}
.eqi.t4{border-color:#e8384f;background-color:#3d1820;box-shadow:0 0 8px #e8384faa}.eqi.t5{border-color:#16c9b0;background-color:#123532;box-shadow:0 0 10px #16c9b0;animation:eterna 2.4s linear infinite}
@keyframes eterna{0%{border-color:#16c9b0}33%{border-color:#ffd23f}66%{border-color:#d36cff}100%{border-color:#16c9b0}}
.eqi.empty{opacity:.28;filter:grayscale(1);border-style:dashed}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.eqslot{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--parch-2);border:2px solid var(--wood-edge);border-radius:8px;padding:8px 4px;cursor:pointer;font:inherit;color:var(--ink)}
.eqslot small{font-size:12px;text-align:center;line-height:1.2}.eqslot small b{text-shadow:0 1px 0 #0003}
.eqh{font-family:var(--display);font-size:20px;margin:12px 0 6px}.eqh small{font-family:var(--body);font-size:13px;color:#7a6a4a}
.bag{display:flex;flex-wrap:wrap;gap:6px}.bagit{background:none;border:0;padding:0;cursor:pointer}
.bagit:hover .eqi,.eqslot:hover .eqi{filter:brightness(1.2)}
.stcols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.stl{list-style:none;padding:0;margin:6px 0 10px;font-size:14px}.stl li{display:flex;justify-content:space-between;gap:10px;padding:4px 8px;border-bottom:1px dashed #b79f73}
.stl b{color:var(--ink);font-variant-numeric:tabular-nums}.stl em{font-style:normal;font-size:12px}.stl em.up{color:#2f6a1b}.stl em.dn{color:var(--blood)}
.hxp{font-size:12px;margin:-4px 0 8px}.hxp .bar{height:8px;background:#3a2c1c;border-radius:4px;overflow:hidden;margin-top:2px}.hxp .bar i{display:block;height:100%;background:#5fd17a}
.itemc{display:flex;gap:14px;align-items:center;margin-bottom:6px}.itemc h2{margin:0}
.eqmsg{background:#fff5d0;border:2px solid var(--gold);border-radius:6px;padding:6px 10px;font-size:14px}
.forgec{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--parch-2);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.forgec .odds{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;font-weight:700;margin-top:3px}
#hProf{flex-direction:column;align-items:stretch;gap:3px}.pxp{display:block;height:4px;background:#0007;border-radius:2px;overflow:hidden}.pxp i{display:block;height:100%;background:#9be36a}
.profl{display:grid;grid-template-columns:1fr 1fr;gap:8px}.profc{background:var(--parch-2);border-radius:8px;padding:8px 10px;font-size:13px}
.profc .ph{display:flex;justify-content:space-between;gap:6px;align-items:baseline}.profc .ph small{font-size:12px;color:#6b5a3a}
.profc .bar{height:9px;background:#3a2c1c;border-radius:4px;overflow:hidden;margin:4px 0}.profc .bar i{display:block;height:100%;background:#e0a92c}.profc>small{display:block;font-size:12px;line-height:1.3}
.tiercnt{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;font-weight:700;margin-bottom:8px}
.bagf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}.bagf button{font:600 13px var(--body);padding:5px 10px;border-radius:14px;border:2px solid var(--wood-edge);background:var(--parch-2);color:var(--ink);cursor:pointer}.bagf button[aria-pressed=true]{background:var(--wood-edge);color:var(--parch)}
.bagl{display:flex;flex-direction:column;gap:5px}
.bagpg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}.bagpg button{font:inherit;font-size:13px;font-weight:700;padding:4px 10px;border-radius:7px;border:2px solid #9a6a24;background:#f3dfb4;color:#3a2510;cursor:pointer}.bagpg button[aria-pressed=true]{background:#7a4a12;color:#ffe9a8}.bagpg small{font-weight:600;opacity:.8}.bcap{margin-left:auto;font-size:12.5px;font-weight:700;color:#5b4a2e}
.bgrid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;padding:6px;background:#5a3c1c;border:3px solid #3b2a2a;border-radius:8px}
@media (max-width:640px){.bgrid{grid-template-columns:repeat(6,1fr);gap:3px;padding:4px}}
.bcell{position:relative;aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:0;border-radius:6px;border:2px solid var(--tc,#3b2a2a);background:radial-gradient(circle at 50% 40%,#f4e3bd,#d7bd8a);cursor:pointer;min-width:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.bcell .eqi{pointer-events:none}.bcell.empty{border-color:#3b2a2a;background:#7a5634;box-shadow:inset 0 2px 4px rgba(0,0,0,.45);cursor:default}
.bcell[style*='#16c9b0'],.bcell.t5{animation:bglow 2s ease-in-out infinite}.hav.et canvas{animation:hglow 2s ease-in-out infinite;border-color:#5ff2dc}@keyframes hglow{0%,100%{box-shadow:0 0 4px #16c9b0}50%{box-shadow:0 0 14px #5ff2dc}}@keyframes bglow{0%,100%{box-shadow:0 0 4px #16c9b0,inset 0 0 6px #5ff2dc66}50%{box-shadow:0 0 14px #5ff2dc,inset 0 0 12px #5ff2dcaa}}
.bcell.on{outline:3px solid #ffd24a;outline-offset:1px;z-index:1}.bcell.nw .eqi{opacity:.55}.bcell:hover:not(.empty){filter:brightness(1.08)}
.blv{position:absolute;right:1px;bottom:0;font-size:10px;line-height:1;padding:1px 3px;border-radius:4px;background:rgba(40,24,10,.85);color:#ffe6a8}.bcell.nw .blv{background:#a3352a;color:#fff}
.bup{position:absolute;left:2px;top:0;font-style:normal;font-size:11px;color:#2f9a1b;text-shadow:0 0 2px #fff}.bfz{position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:#a24fd6;border:1px solid #fff}
.bagsel{position:sticky;bottom:0;z-index:3;margin-top:8px;padding:8px 10px;background:#fff3d4;border:2px solid #b9871d;border-radius:8px;box-shadow:0 -4px 12px rgba(0,0,0,.25)}.bagsel .bsh{display:flex;gap:8px;align-items:center}.bagsel .bsh small{display:block;font-size:12px;color:#5b4a2e}.bagsel .stl{margin:6px 0}.bagsel .row{margin:6px 0 0;gap:6px;flex-wrap:wrap;justify-content:flex-start}.bagsel .btn{margin:0}.bhint{font-size:12px;margin:4px 0}
.bagrow{display:flex;align-items:center;gap:10px;text-align:left;background:var(--parch-2);border:2px solid transparent;border-radius:8px;padding:5px 8px;cursor:pointer;font:inherit;color:var(--ink)}.bagrow:hover{border-color:var(--wood-edge)}
.bagrow .bn{flex:1;min-width:0;display:flex;flex-direction:column}.bagrow .bn b{font-size:14px}.bagrow .bn small{font-size:12px;color:#5b4a2e;line-height:1.3}
.bagrow .tags{display:flex;flex-direction:column;gap:3px;align-items:flex-end}.bagrow em{font-style:normal;font-size:11px;font-weight:700;padding:2px 6px;border-radius:8px;white-space:nowrap}.bagrow em.up{background:#d6efc4;color:#2f6a1b}.bagrow em.fz{background:#f5e0ff;color:#7a2fa8}
.unl{list-style:none;padding:0;margin:0 0 10px;font-size:14px}.unl li{display:grid;grid-template-columns:76px 1fr auto;gap:8px;padding:6px 10px;border-bottom:1px dashed #b79f73;align-items:center}
.unl li b{color:var(--ink)}.unl li em{font-style:normal;font-size:12px;font-weight:700;color:#8a7454}.unl li.ok em{color:#2f6a1b}.unl li:not(.ok){color:#6b5a3a}
.slotc{display:flex;gap:14px;align-items:center;margin-bottom:6px}.slotn{flex:0 1 auto;min-width:120px}.slotup{flex:0 1 270px;margin:0 40px 0 auto;padding:8px 10px;background:#fff3d4;border:2px solid #c9a15a;border-radius:8px;display:flex;flex-direction:column;gap:5px;align-self:flex-start}.slotup .uptl{color:#7a4a12;font-size:14px}.slotup .chips{margin:0}.slotup .row{margin:0;justify-content:flex-start;gap:6px}.slotup .btn{margin:0}.slotup .bqb{margin:0;border:0;padding:0;background:none}.card .top .slotup{margin-right:0}@media (max-width:640px){.slotc{flex-wrap:wrap}.slotup{flex-basis:100%;margin:0}.slotc canvas{width:110px!important;height:91px!important}}.slotc canvas{flex:none;border-radius:8px;background:#6aa84f}.slotc h2{margin:0 0 4px}
.conds{list-style:none;padding:0;margin:0 0 10px;font-size:14px}.conds li{display:flex;gap:8px;align-items:center;padding:3px 0}
.conds i,.lvtab i{font-style:normal;font-weight:800}.conds i.ok,.lvtab i.ok{color:#2f6a1b}.conds i.no,.lvtab i.no{color:var(--blood)}
.lvtab{overflow-x:auto}.lvtab table{width:100%;border-collapse:collapse;font-size:13px}.lvtab th{text-align:left;font-size:12px;color:#6b5a3a;padding:4px 6px;border-bottom:2px solid var(--wood-edge)}
.lvtab td{padding:5px 6px;border-bottom:1px dashed #b79f73;vertical-align:top}.lvtab td:first-child{font-weight:700;white-space:nowrap}.lvtab td:nth-child(2),.lvtab td:nth-child(3){white-space:nowrap}.lvtab tr.dim td{color:#8a7454}

async function cloudFlush(){CLOUD.timer=0;if(CLOUD.busy||!CLOUD.on)return;CLOUD.busy=true;
  try{for(const k of Object.keys(CLOUD.q)){const body=CLOUD.q[k];delete CLOUD.q[k];
    try{if(body===null)await cdoc(k).delete();else await cdoc(k).set(body)}catch(e){if(e&&e.code==='unavailable'){CLOUD.q[k]=CLOUD.q[k]||body}else if(e&&(e.code==='revoked'||e.code==='not_granted'||e.code==='invalid_argument'))CLOUD.on=false}}}
  finally{CLOUD.busy=false;if(Object.keys(CLOUD.q).length&&CLOUD.on)CLOUD.timer=setTimeout(cloudFlush,4000)}}

async function cloudPull(){
  if(!(await CLOUD.ready))return false;
  let changed=false;
  try{const ad=await cdoc('accounts').get();const rem=ad.exists?JSON.parse(ad.data().list||'[]'):[],rdel=ad.exists?JSON.parse(ad.data().del||'[]'):[];
    const dels=[...new Set([...delList(),...rdel])];LS.set('ttv_del',dels);
    let loc=accList().filter(a=>!dels.includes(a.id));
    for(const r of rem){if(dels.includes(r.id))continue;
      const d=await cdoc('acc_'+r.id).get();if(!d.exists)continue;const body=d.data();let st;try{st=JSON.parse(body.json)}catch(e){continue}
      const cur=LS.get('ttv_cur_'+r.id,null);
      if(S&&ACC===r.id)continue;
      if(!cur||(body.t||0)>(cur.savedAt||0)){if(!LS.set('ttv_cur_'+r.id,st)){pruneBackups();LS.set('ttv_cur_'+r.id,st)}changed=true}
      const i=loc.findIndex(a=>a.id===r.id);if(i<0){if(loc.length<MAXACC){loc.push(r);changed=true}}else if((r.last||0)>(loc[i].last||0))loc[i]=r}
    accSet(loc);
    // ván chỉ có trong máy thì đưa lên mây
    for(const a of loc){const st=LS.get('ttv_cur_'+a.id,null);if(st&&!rem.some(r=>r.id===a.id))cloudSaveAcc(a.id,st)}
    if(!rem.length&&!loc.length)return changed;
    cloudQueue('accounts',{list:JSON.stringify(loc),del:JSON.stringify(dels),t:Date.now()});
  }catch(e){}
  return changed}

  return `<p class="sub">Mỗi lượt quay tốn ${PS_IC(16)} ${SPIN_COST} Đá linh thú. Đá rơi khi đánh ải (chương càng cao càng dễ rơi, ải trùm chắc chắn rơi) và khi câu ở Hồ ước nguyện.</p>

function petsBody(){const ok=zooOpen(),now=Date.now();
  return `<p class="sub">Linh thú mở khoá bằng ${PET_UNLOCK} thú hồn (quay ở Vòng quay thú hồn). Cho linh thú ăn đủ lúa, nó sẽ về vườn ngủ một giấc rồi lên cấp; cấp càng cao, hiệu ứng càng mạnh và giấc ngủ càng dài. Cứ mỗi 10 cấp cần đột phá bằng thú hồn mới lên tiếp được.</p>
  ${ok?`<div class="stat"><span>🌾 <b>${S.food}</b></span>${petKeys.map(k=>`<span>${petImg(k,20)} <b>${soulOf(k)}</b></span>`).join('')}</div>`:lockRows(ZOO_LV)}
  <div class="grid">${petKeys.map(k=>{const d=PETS[k],p=ok&&S.pets&&S.pets[k],lv=p?p.lv:0,cap=p?petCap(p):10,so=soulOf(k);
    const rows=d.buff.map(b=>`<div style="display:flex;align-items:baseline;gap:6px;font-size:13px;padding:4px 0;border-bottom:1px dashed #c9a877"><span style="flex:1">${b[1]}</span><b>${p?petBuffTxt(b,lv):'—'}</b><small style="color:#7a5a36">${lv<PET_MAX?`→ ${petBuffTxt(b,lv+1)}`:'Tối đa'}</small></div>`).join('');
    let act='';
    if(!ok)act=`<button class="btn" type="button" disabled>🔒 Mở ở cấp ${ZOO_LV}</button>`;
    else if(!p)act=`<div class="hxp"><span>${petImg(k,18)} Thú hồn ${so}/${PET_UNLOCK}</span><div class="bar"><i style="width:${Math.min(100,100*so/PET_UNLOCK)}%"></i></div></div><button class="btn gold" data-unlock="${k}" type="button" ${so>=PET_UNLOCK?'':'disabled'}>Mở khoá · ${PET_UNLOCK} thú hồn</button>`;
    else if(p.sleep>now)act=`<div class="bqb"><b>💤 Đang ngủ để lên cấp ${lv+1}</b><small>Dậy sau <span data-pz="${k}">${fmtDur(p.sleep-now)}</span></small></div>`;
    else if(lv>=PET_MAX)act=`<div class="eff"><b>Đã đạt cấp tối đa.</b></div>`;
    else if(lv>=cap){const c=PET_BRK[p.brk||0];act=`<div class="hxp"><span>Đột phá để mở cấp ${cap+1}-${Math.min(PET_MAX,cap+10)}: ${petImg(k,18)} ${so}/${c}</span><div class="bar"><i style="width:${Math.min(100,100*so/c)}%"></i></div></div><button class="btn gold" data-brk="${k}" type="button" ${so>=c?'':'disabled'}>⚡ Đột phá · ${c} thú hồn</button>`}
    else{const need=petFeed(lv),f=p.food||0,give=Math.min(S.food,need-f);
      act=`<div class="hxp"><span>🌾 ${f}/${need} · ngủ ${fmtDur(petSleep(lv))} → cấp ${lv+1}</span><div class="bar"><i style="width:${100*f/need}%"></i></div></div>
      <button class="btn gold" data-feed="${k}" type="button" ${give>0?'':'disabled'}>🌾 Cho ăn ${give>0?give:''} lúa</button>`}
    return `<div class="card" style="${ok?'':'opacity:.6'}"><div class="top"><canvas width="80" height="80" data-pet="${k}" style="width:80px;height:80px;${p||!ok?'':'filter:grayscale(.85) brightness(.8)'}"></canvas><div><h3>${d.name}</h3><span class="lvl">${p?`Cấp ${lv}/${cap}`:'Chưa mở khoá'}</span></div></div>
      <div class="eff">${d.desc}</div><div style="margin:6px 0 8px">${rows}</div>${act}</div>`}).join('')}</div>`}
function openZoo(){petTick(Date.now());const y=$('modal').hidden?0:$('sheet').scrollTop;
  openSheet(`<h2>🦁 Vườn thú</h2>${tabsOf(zTab,[['pets','🐾 Linh thú'],['wheel','🎡 Vòng quay thú hồn']],'data-ztab')}${zTab==='wheel'?wheelBody():petsBody()}`);
  const sh=$('sheet');sh.querySelectorAll('[data-ztab]').forEach(b=>b.onclick=()=>{zTab=b.dataset.ztab;zRes=null;openZoo();$('sheet').scrollTop=0});
  sh.querySelectorAll('canvas[data-pet]').forEach(c=>{const d=PETS[c.dataset.pet],sp=d.sh==='sheep';thumb(c,A[d.idle],sp?16:40,sp?24:40,sp?96:112,sp?84:112)});
  const again=()=>{const yy=$('sheet').scrollTop;openZoo();$('sheet').scrollTop=yy};
  sh.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=()=>{const k=b.dataset.unlock;if(soulOf(k)<PET_UNLOCK)return;S.psoul[k]-=PET_UNLOCK;S.pets=S.pets||{};S.pets[k]={lv:1,food:0,sleep:0,brk:0};sfx('up');toast(`${PETS[k].name} đã thức tỉnh và về Vườn thú của bạn!`);save();again()});
  sh.querySelectorAll('[data-brk]').forEach(b=>b.onclick=()=>{const k=b.dataset.brk,p=S.pets[k],c=PET_BRK[p.brk||0];if(soulOf(k)<c)return;S.psoul[k]-=c;p.brk=(p.brk||0)+1;sfx('up');toast(`${PETS[k].name} đột phá! Có thể lên tới cấp ${petCap(p)}.`);save();again()});
  sh.querySelectorAll('[data-feed]').forEach(b=>b.onclick=()=>{const k=b.dataset.feed,p=S.pets[k],need=petFeed(p.lv),give=Math.min(S.food,need-(p.food||0));if(give<=0)return;
    S.food-=give;p.food=(p.food||0)+give;sfx('coin');if(p.food>=need){p.sleep=Date.now()+petSleep(p.lv);toast(`${PETS[k].name} no bụng, về vườn thú ngủ ${fmtDur(petSleep(p.lv))}.`)}ui();save();again()});
  sh.querySelectorAll('[data-spin]').forEach(b=>b.onclick=()=>{const n=+b.dataset.spin;if(!zooOpen()||(S.pstone||0)<SPIN_COST*n)return;S.pstone-=SPIN_COST*n;
    const res=[];for(let i=0;i<n;i++)res.push(spinOnce());save();ui();sh.querySelectorAll('[data-spin]').forEach(x=>x.disabled=true);
    const wh=$('wheel'),seg=360/WHEEL.length,last=res[res.length-1].i;wh.style.transform=`rotate(${360*6-(last*seg+seg/2)}deg)`;sfx('work');
    setTimeout(()=>{sfx('up');toast(n>1?`Quay ${n} lần xong!`:res[0].txt);if($('wheel')&&zTab==='wheel')again()},2500)});
  $('sheet').scrollTop=y;tmRefresh=again}
// thú đang thức đi dạo trong thành; thú ngủ nằm trong vườn
const ZOO_BED=[[5.6,6.35],[6.5,5.75],[7.4,6.35]];
function petNpcs(m){if(!zooOpen()||!S.pets)return [];m.PETN=m.PETN||{};const L=[];petKeys.forEach((k,i)=>{const p=S.pets[k];if(!p){delete m.PETN[k];return}const d=PETS[k];
  let n=m.PETN[k];if(!n){n=m.PETN[k]={x:(4+i*3)*T+32,y:9*T+40,flip:false,moving:false,path:null,wait:rand(0,2),idle:d.idle,run:d.run,sh:d.sh,o:i*4,area:[2,8,23,17],k}}

  const MW=M.MW,MH=M.MH;if(isSolid(tx,ty))return null;
  const prev=new Int32Array(MW*MH).fill(-1),q=[sy*MW+sx];prev[sy*MW+sx]=sy*MW+sx;let h=0;
  while(h<q.length){const c=q[h++];if(c===ty*MW+tx)break;const cx=c%MW,cy=(c/MW)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const nx=cx+dx,ny=cy+dy;if(isSolid(nx,ny))continue;const n=ny*MW+nx;if(prev[n]!==-1)continue;prev[n]=c;q.push(n)}}

  n.moving=false;

    for(let k=0;k<10;k++){const tx=clamp(Math.floor(n.x/T)+Math.floor(rand(-6,7)),a[0],a[2]),ty=clamp(Math.floor(n.y/T)+Math.floor(rand(-3,4)),a[1],a[3]);

  return hit;
}

function drawFight(){
  const F=FIGHT;if(!F)return;
  const live=F.units.filter(u=>!u.dead);const mx=live.reduce((a,u)=>a+u.x,0)/Math.max(1,live.length);
  const want=VW>=F.W?-(VW-F.W)/2:clamp(mx-VW/2,0,F.W-VW);F.cam+=(want-F.cam)*.08;
  const cx=Math.round(F.cam),cy=Math.round(-(VH-F.H)/2-(VH>F.H+120?20:0));
  g.fillStyle='#2c2418';g.fillRect(0,0,VW,VH);
  g.drawImage(F.bg,-128-cx,-700-cy);
  if(hexOn()&&F.hex){g.drawImage(F.hex,-cx,-cy);
    for(const u of live){if(!u.cell)continue;const p=hexXY(u.cell.c,u.cell.r);hexPath(g,p.x-cx,p.y-cy,.9);g.fillStyle=u.hero?'rgba(255,210,63,.32)':u.champ?'rgba(190,120,255,.32)':u.side?'rgba(217,71,58,.26)':'rgba(70,150,230,.26)';g.fill();g.strokeStyle=u.hero?'rgba(255,220,90,.9)':u.champ?'rgba(210,160,255,.9)':u.side?'rgba(240,110,90,.7)':'rgba(130,200,255,.7)';g.lineWidth=2;g.stroke()}}
  const fr=time*10;
  if(F.rally>0)for(const u of live)if(u.side===0){g.save();g.globalAlpha=.35+.2*Math.sin(time*10);g.fillStyle='#ffd23f';g.beginPath();g.ellipse(u.x-cx,u.y-cy,26,9,0,0,Math.PI*2);g.fill();g.restore()}
  const order=F.units.slice().sort((a,b)=>a.y-b.y);
  for(const u of order){
    if(u.dead&&u.dt>.8)continue;
    let key=u.idle,frame=fr+u.o;
    if(!u.dead&&u.state==='run')key=u.run;
    if(!u.dead&&u.state==='atk'&&u.at<.7){key=u.atkSp;const img=A[key],n=img?Math.floor(img.width/(SHEET[u.sh]||SHEET.def).fw):1;frame=Math.min(n-1,Math.floor(u.at/.7*n))}
    if(u.dead)g.globalAlpha=Math.max(0,1-u.dt/.8);
    if(u.champ){drawChamp(g,u,u.x-cx,u.y-cy);g.globalAlpha=1;if(!u.dead){const w=44,x=Math.round(u.x-cx-w/2),y=Math.round(u.y-cy-100);g.fillStyle='#120c08';g.fillRect(x-1,y-1,w+2,6);g.fillStyle='#c48cff';g.fillRect(x,y,Math.max(0,w*u.hp/u.max),4)}continue}
    if(u.hero&&!u.dead)eternalGlow(g,u.x-cx,u.y-cy,u.scale||1,false);
    if(u.hero){g.save();g.globalAlpha*=.5;g.fillStyle='#ffd23f';g.beginPath();g.ellipse(u.x-cx,u.y-cy+2,24,8,0,0,Math.PI*2);g.fill();g.restore()}
    if(u.q&&!u.side){key=qSheet(key,u.q);if(!u.dead)qAura(g,u,u.x-cx,u.y-cy,true)}
    if(u.hero&&!u.dead)etShadow(g,()=>animS(g,key,u.sh,frame,u.x-cx,u.y-cy,u.flip,u.scale));else animS(g,key,u.sh,frame,u.x-cx,u.y-cy,u.flip,u.scale);
    if(u.q===3&&!u.side&&!u.dead)qAura(g,u,u.x-cx,u.y-cy,false);
    if(u.hero&&!u.dead)eternalGlow(g,u.x-cx,u.y-cy,u.scale||1,true);
    if(u.hit>0&&!u.dead){g.save();g.globalAlpha=.45;g.globalCompositeOperation='lighter';animS(g,key,u.sh,frame,u.x-cx,u.y-cy,u.flip,u.scale);g.restore()}
    g.globalAlpha=1;
    if(!u.dead&&!u.boss){const w=u.hero?44:34,x=Math.round(u.x-cx-w/2),y=Math.round(u.y-cy-(u.sh==='lan'?96:78)*u.scale);g.fillStyle='#120c08';g.fillRect(x-1,y-1,w+2,6);g.fillStyle=u.hero?'#ffd23f':u.side?'#d9473a':'#5fd17a';g.fillRect(x,y,Math.max(0,w*u.hp/u.max),4);if(u.q){g.fillStyle='#120c08';g.fillRect(x-10,y-3,8,10);g.fillStyle=QUAL[u.q].c;g.fillRect(x-9,y-2,6,8)}}
  }
  for(const s of F.shots){g.save();g.translate(s.x-cx,s.y-cy);if(s.orb){g.shadowColor=s.orb;g.shadowBlur=14;g.fillStyle=s.orb;g.beginPath();g.arc(0,0,8,0,7);g.fill();g.fillStyle='#fff';g.globalAlpha=.85;g.beginPath();g.arc(-2,-2,3.5,0,7);g.fill()}else{g.rotate(s.a||0);g.drawImage(A.arrow,-32,-32)}g.restore()}
  for(const f of F.fx){if(f.k==='heal_fx')anim(g,'heal_fx','def',f.t*10,f.x-cx,f.y-cy);else animS(g,f.k,f.k==='fx_boom'?'def':'fx',f.t*14,f.x-cx,f.y-cy,false,f.big?1.6:1)}
  F.cx=cx;F.cy=cy;
}
function drawFightText(){

  for(const t of F.txt){ctx.globalAlpha=clamp(1.2-t.t,0,1);ctx.font=`800 ${t.big?18:14}px "Be Vietnam Pro",sans-serif`;ctx.lineWidth=3;ctx.strokeStyle='rgba(20,12,6,.9)';ctx.strokeText(t.s,sx(t.x),sy(t.y));ctx.fillStyle=t.c;ctx.fillText(t.s,sx(t.x),sy(t.y))}

}

const HAI={};function hAnim(id,k){const a=HANIM[id]&&HANIM[id][k];if(!a)return null;if(!HAI[a.src]){const i=new Image();i.src=a.src;HAI[a.src]=i}const im=HAI[a.src];return im.complete&&im.naturalWidth?Object.assign({im},a):null}
function hPor(id,h=140,delay=0,style=''){const a=HANIM[id]&&HANIM[id].idle;if(!a)return `<img src="${HIMG[id]}" alt="" style="animation-delay:-${delay}s;${style}">`;
  const sc=h/a.fh,w=Math.round(a.fw*sc);return `<div role="img" aria-label="${heroById(id).name}" style="width:${w}px;height:${h}px;flex:none;margin-bottom:6px;background:url(${a.src}) 0 0/${w*a.n}px ${h}px no-repeat;image-rendering:pixelated;--ex:-${w*a.n}px;animation:hsp ${a.n*.14}s steps(${a.n}) infinite;${style}"></div>`}

function heroBoard(){const ok=heroBoardOpen(),rdy=recruitReady();

function drawWorldMap(c){
  const x=c.getContext('2d'),W=320,H=200,r2=rng(11);
  x.fillStyle='#e8d5a6';x.fillRect(0,0,W,H);
  for(let i=0;i<900;i++){x.fillStyle=r2()<.5?'#dcc58f':'#f0e0b8';x.fillRect(Math.floor(r2()*W),Math.floor(r2()*H),2,1)}
  x.fillStyle='#8fb6c9';for(let yy=0;yy<H;yy++){const edge=W*.86-Math.sin(yy*.05)*14+(yy>H*.7?-(yy-H*.7)*1.2:0);x.fillRect(Math.floor(edge),yy,W,1)}
  for(let i=0;i<30;i++){x.fillStyle='#b5d3e0';x.fillRect(Math.floor(W*.88+r2()*30),Math.floor(r2()*H),5,1)}
  const mtn=(mx,my,s)=>{for(let k=0;k<s;k++){x.fillStyle=k<s/2?'#8b7a62':'#6e5e48';x.fillRect(mx-k,my+k,1+(k*2),1)}x.fillStyle='#f4f0e6';x.fillRect(mx-1,my,3,2)};
  [[60,62,10],[72,58,12],[84,66,9],[150,40,10],[240,90,12],[255,96,10],[226,98,9],[180,22,9]].forEach(m=>mtn(...m));
  const tree=(tx,ty)=>{x.fillStyle='#4f7a3a';x.fillRect(tx-2,ty-3,5,4);x.fillStyle='#6b4424';x.fillRect(tx,ty+1,1,2)};
  for(let i=0;i<40;i++)tree(Math.floor(130+r2()*45),Math.floor(145+r2()*30));
  for(let i=0;i<20;i++)tree(Math.floor(20+r2()*40),Math.floor(150+r2()*30));
  x.fillStyle='#7aa6c2';let rx=110;for(let yy=0;yy<H;yy++){rx+=Math.sin(yy*.08)*1.1;x.fillRect(Math.floor(rx),yy,3,1)}
  x.strokeStyle='#6b4424';x.lineWidth=2;x.strokeRect(4,4,W-8,H-8);
  x.fillStyle='#6b4424';x.fillRect(W-30,H-38,1,22);x.fillRect(W-40,H-27,21,1);x.fillStyle='#a8322a';x.fillRect(W-31,H-40,3,6);
}

  const prev=[...$('sheet').querySelectorAll('canvas[data-look]')];

  $('sheet').querySelectorAll('[data-prof]').forEach(b=>b.onclick=()=>{pick=b.dataset.prof;$('cf').innerHTML='';$('sheet').querySelectorAll('[data-prof]').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  $('back').onclick=()=>reminder(nm);
  $('go').onclick=()=>{$('cf').innerHTML=`<div class="stat" style="margin-top:10px;align-items:center;justify-content:space-between"><span>Chọn <b>${PROFS[pick].name}</b> làm nghề đầu tiên? Nghề này không đổi được.</span><button class="btn gold" id="yes" type="button">Chắc chắn, bắt đầu</button></div>`;
    $('yes').onclick=()=>{const a=accList();if(a.length>=MAXACC){toast('Đã đủ tài khoản.');return}const id='a'+Date.now();a.push({id,name:nm,created:Date.now(),last:Date.now(),day:1,profs:[PROFS[pick].name],lands:1});accSet(a);
      ACC=id;S=newState(nm,pick);rollTasks();begin(true)}};
}
function begin(fresh){hideTitle();
  fixFields();S.tasks=S.tasks.filter(t=>t.loc!=='forest'&&t.loc!=='gate');M=MAPS[S.map]||MAPS.village;setPlotSolid();P.work=null;placeAt(S.tx,S.ty);if(isSolid(S.tx,S.ty)){M=MAPS.village;placeAt(8,9)}
  for(const k in FIELDT)delete FIELDT[k];PART.length=0;
  closeSheet();setHud(true);dock();if(!fresh)offlineReport();ui();save();
  if(fresh)openSheet(`<h2>Ngày đầu tiên</h2><p>Chào ${esc(S.name)}, ${PROFS[S.main].name.toLowerCase()} của làng. Mũi tên vàng trên đầu là nhân vật của bạn. Bấm vào ô nào trên đất thì nhân vật đi tới ô đó.</p>
  <p>Việc hôm nay nằm trong bảng việc. Đi tới nơi có dấu <b>!</b> vàng và bấm <b>E</b> (hoặc bấm thẳng vào công trình) để làm. Các công trình có dải lụa màu là nơi làm việc của làng; dải màu xám nghĩa là bạn chưa học nghề đó. Muốn học thêm nghề, hãy vào <b>Hội quán</b>.</p>
  <p>Có vàng rồi thì <b>vào Thành trì</b> (lâu đài xanh phía bắc). Bên trong là vùng đất riêng của bạn, có chỗ cho 4 ruộng lúa, 2 lò rèn, 2 phòng thuốc và 1 trại lính, cùng sân tập cho quân lính.</p>
  <p>Trò chơi chạy theo giờ thật: thể lực tự hồi, lúa chín sau 30 phút, việc mới có mỗi 4 giờ, công trình và nghề làm ra của cải mỗi giờ kể cả khi bạn tắt game. Ghé <b>nhà</b> để xem thu nhập.</p><div class="row" style="justify-content:flex-start"><button class="btn gold" data-close type="button">Vào làng</button></div>`);
}

window.addEventListener('keydown',e=>{
  const k=e.key.length===1?e.key.toLowerCase():e.key;
  if(e.target.tagName==='INPUT'){if(e.key==='Enter'&&$('go')&&!$('go').disabled)$('go').click();return}
  if(k==='Escape'&&!$('modal').hidden&&S&&scene==='town'){closeSheet();return}
  if(!$('modal').hidden)return;
  if((k==='e'||k===' '||k==='Enter')&&S&&scene==='town'&&near&&!P.work&&!fadeDir){e.preventDefault();const a=actionFor(near);a&&a.fn();return}
  if(k==='c'&&S&&scene==='town'&&!fadeDir){openChar();return}
  if(DIRS[k]){keys[k]=true;e.preventDefault()}
});
window.addEventListener('keyup',e=>{const k=e.key.length===1?e.key.toLowerCase():e.key;keys[k]=false});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false});
const toWorld=e=>[e.clientX/SCALE+camX,e.clientY/SCALE+camY];
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||!S){HOVER=null;return}{const r=REPLAY.find(r=>e.clientX>=r.x&&e.clientX<=r.x+r.w&&e.clientY>=r.y&&e.clientY<=r.y+r.h);REPHOV=r?(r.npc!=null?'n'+r.npc:M.wild!=null?r.k:-1):-1;cv.style.cursor=REPHOV!==-1?'pointer':''}const [wx,wy]=toWorld(e);HOVER=[Math.floor(wx/T),Math.floor(wy/T)]});
cv.addEventListener('pointerleave',()=>HOVER=null);
let tapS=null;
cv.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')tapAt(e);else tapS={x:e.clientX,y:e.clientY,t:performance.now()}});
cv.addEventListener('pointerup',e=>{if(e.pointerType==='mouse'||!tapS)return;const ok=Math.hypot(e.clientX-tapS.x,e.clientY-tapS.y)<14&&performance.now()-tapS.t<700;tapS=null;if(ok)tapAt(e)});
cv.addEventListener('pointercancel',()=>tapS=null);
function tapAt(e){
  if(!S||scene!=='town'||!$('modal').hidden||P.work||fadeDir)return;
  if(M.wild!=null||M.id==='castle'){const r=REPLAY.find(r=>e.clientX>=r.x-4&&e.clientX<=r.x+r.w+4&&e.clientY>=r.y-4&&e.clientY<=r.y+r.h+4);if(r){if(r.npc!=null)openWork(FARMPT[r.npc]);else openStage(r.ci,r.k);return}}
  const [wx,wy]=toWorld(e),tx=Math.floor(wx/T),ty=Math.floor(wy/T);
  let hit=null;
  for(const b of M.BLD)if(b.name&&!hit){const img=A[b.img],h=BOTTOM[b.img]-(TOPV[b.img]||0);if(Math.abs(wx-b.cx*T)<img.width/2-8&&wy<b.by*T&&wy>b.by*T-h)hit=b.id}
  if(M.id==='castle'&&farmAt(tx,ty)!=null){const fi=farmAt(tx,ty),[cx,cy]=pTile();if(farmAt(cx,cy)===fi&&!(P.path&&P.path.length))openWork(FARMPT[fi]);else goTile(tx,ty,'cfarm'+fi);return}
  if(M.wild!=null)for(const c of M.camps)if(c.tiles.some(([a,b])=>a===tx&&(b===ty||b-1===ty))||(c.k===9&&tx>=31&&tx<=35&&ty>=2&&ty<=6))hit='stage_'+c.k;
  if(M.id==='castle'){for(const p of M.POINTS){if(!p.slot)continue;const [t,i,cx,by]=p.slot,lv=S.slots[t][i];if(lv&&t==='farm')continue;
    if(Math.abs(wx-cx*T)<96&&wy<by*T&&wy>by*T-(lv?BOTTOM[BUILD[t].img]-TOPV[BUILD[t].img]:128))hit=p.id}}
  else{
    if(inField(tx,ty)){if(isSolid(tx,ty))return;const [cx,cy]=pTile();if(inField(cx,cy)&&!(P.path&&P.path.length))openWork(M.POINTS.find(q=>q.id==='field'));else goTile(tx,ty,'field');return}
    {const dx=(tx+.5-POND.cx)/POND.rx,dy=(ty+.5-POND.cy)/POND.ry;if(dx*dx+dy*dy<1.25)hit='lake'}
    if(tx>=MARKET.x&&tx<MARKET.x+MARKET.w&&ty>=MARKET.y-1&&ty<MARKET.y+MARKET.h&&wy>(MARKET.y+MARKET.h)*T-MKT_H+10)hit='market';
  }
  // ô lối đi (ra làng, ải…) vẫn bấm được; ô trước cửa công trình chỉ là đường đi, phải bấm vào công trình
  if(!hit)for(const p of M.POINTS){if(p.slot||PUBLIC[p.id]||p.id==='lake'||M.BLD.some(b=>b.id===p.id))continue;const [px,py]=ptTile(p);if(px===tx&&py===ty)hit=p.id}
  if(!hit)for(const b of M.BLD){const x0=Math.round(b.cx-b.fw/2);if(tx>=x0&&tx<x0+b.fw&&ty>=b.by-b.fh&&ty<b.by&&M.POINTS.some(q=>q.id===b.id)){hit=b.id;break}}
  if(hit){const p=M.POINTS.find(q=>q.id===hit);if(Math.hypot(p.x-P.x,p.y-P.y)<50&&!(P.path&&P.path.length)){const a=actionFor(p);a&&a.fn()}else{const [px,py]=ptTile(p);goTile(px,py,hit)}return}
  if(isSolid(tx,ty))return;goTile(tx,ty);
}
$('act').onclick=()=>{if(near&&!P.work&&!fadeDir){const a=actionFor(near);a&&a.fn()}};
function walkOrDo(id){const p=M.POINTS.find(q=>q.id===id);if(Math.hypot(p.x-P.x,p.y-P.y)<50){const a=actionFor(p);a&&a.fn()}else{const [px,py]=ptTile(p);goTile(px,py,id)}}
$('goCastle').onclick=()=>{if(M.wild!=null){const k=Math.min(S.adv[M.wild],9);walkOrDo('stage_'+k)}else if(M.id==='castle')openCastle('keep');else walkOrDo('keep')};
$('goHome').onclick=()=>{if(M.wild!=null){fadeDir=1;fadeCb=()=>{M=MAPS.village;const [x,y]=ptTile(M.POINTS.find(q=>q.id==='out'));placeAt(x,y);dock();save()};return}if(M.id==='castle')walkOrDo('exit')};$('invBtn').onclick=()=>openChar('bag');
$('taskList').onclick=e=>{const li=e.target.closest('[data-ti]');if(!li||!S||scene!=='town'||P.work||fadeDir||!$('modal').hidden)return;const t=S.tasks[+li.dataset.ti];if(!t||t.done)return;
  if(!knows(t.prof)){toast(`Bạn chưa học nghề ${PROFS[t.prof].name}.`);return}if(S.energy<t.e){toast(`Không đủ thể lực (cần ${t.e}). ${enNext()}.`);return}
  if(M.id!=='village'){enterMap('village',M.id==='castle'?'keep':'out');setTimeout(()=>{if(!P.work)doWork(t)},900);return}doWork(t)};
$('tasksMin').onclick=()=>{const t=$('tasks');t.classList.toggle('min');$('tasksMin').textContent=t.classList.contains('min')?'Mở':'Thu gọn'};
$('menuBtn').onclick=()=>openMenu();
wireEnTip();$('charBtn').onclick=()=>openChar();$('skBtn').onclick=()=>openSkills();$('hProf').onclick=e=>{const t=e.target.closest('[data-hi]');if(t)hudInfo(t.dataset.hi)};
function openMenu(){const t=(id,ic,n,s,cls)=>`<button type="button" class="mt ${cls||''}" id="${id}"><span class="mi">${ic}</span><b>${n}</b><small>${s}</small></button>`;
  openSheet(`<h2>Menu</h2>
  ${chipsOf([['👤',esc(S.name)],['📅','Ngày '+S.day],[CLOUD.on?'☁️':'💾',CLOUD.on?'Lưu trên tài khoản':'Lưu trong máy','ok'],['🏷️','Phiên bản '+GAME_VER]])}
  <div class="mgrid">${t('mBook','📖','Bách khoa','Trang bị, quái vật')}${t('mInc',IC.gold,'Thu nhập','Mỗi giờ')}${t('mSave','💾','Lưu game','Tạo bản lưu')}${t('mLoad','🗂️','Bản lưu cũ','Mở lại')}${t('mHome','🏰','Màn hình chính','Đổi nhân vật')}${t('mGo','▶️','Tiếp tục','Quay lại chơi','gold')}</div>
  <details class="mhelp"><summary>❔ Cách chơi và ghi công</summary>
  ${chipsOf([['👆','Bấm ô để đi'],['🏠','Bấm công trình để làm việc'],['⌨️','WASD / mũi tên'],['E','Làm việc'],['Esc','Đóng bảng']])}
  <p class="help">Tự lưu mỗi 15 giây và sau mỗi việc, tự sao lưu đầu mỗi ngày. Hình ảnh: Tiny Swords (Pixel Frog), khung giao diện Cup Nooble, biểu tượng Raven Fantasy Icons.</p></details>`);
  $('sheet').classList.add('menu');$('mGo').onclick=closeSheet;
  $('mSave').onclick=()=>{save();backup('hand');toast(`Đã lưu ngày ${S.day}. Mở lại trong mục Bản lưu cũ.`);openMenu()};
  $('mLoad').onclick=()=>openSaves(ACC,true);$('mInc').onclick=()=>openIncome();$('mBook').onclick=()=>openBook();

}

function openSaves(id,inGame){
  const cur=LS.get('ttv_cur_'+id,null),l=LS.get('ttv_bk_'+id,[]),acc=accList().find(a=>a.id===id);
  const row=(title,sub,attr)=>`<div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px"><div><b>${title}</b><div class="sub" style="margin:2px 0 0">${sub}</div></div><button class="btn gold" type="button" ${attr}>Vào</button></div>`;
  openSheet(`<h2>Bản lưu của ${esc(acc?acc.name:'')}</h2><p class="sub">Bản tự sao lưu được tạo vào đầu mỗi ngày (giữ ${MAXAUTO} bản gần nhất). Bản lưu tay tạo bằng nút Lưu game trong Menu (giữ ${MAXHAND} bản).</p>
  <div style="display:grid;gap:8px;margin-top:10px">
  ${cur?row(`Đang chơi: ngày ${cur.day}`,`Tự lưu lần cuối lúc ${fmtTime(acc&&acc.last||Date.now())}`,'data-cur="1"'):''}
  ${l.map((b,i)=>row(`${b.kind==='hand'?'Lưu tay':'Tự sao lưu'}: ngày ${b.day}`,`${b.note?esc(b.note)+' · ':''}${fmtTime(b.at)} · ${b.data.gold} vàng · ${b.data.food} lương thực`,`data-bk="${i}"`)).join('')||'<p class="sub">Chưa có bản sao lưu nào. Bản đầu tiên sẽ có khi bạn ngủ sang ngày mới, hoặc khi bấm Lưu game.</p>'}
  </div><div class="row" style="justify-content:flex-start;margin-top:12px"><button class="btn" id="svBack" type="button">Quay lại</button></div>`);
  if(!inGame)$('sx').hidden=true;
  $('svBack').onclick=()=>inGame?openMenu():startScreen();
  const open=data=>{
    if(inGame&&S)backup('auto','Trước khi mở bản cũ');
    ACC=id;S=JSON.parse(JSON.stringify(data));S.v=4;begin(false);toast(`Đã mở bản lưu ngày ${S.day}.`)};
  $('sheet').querySelectorAll('[data-cur]').forEach(b=>b.onclick=()=>open(LS.get('ttv_cur_'+id,null)));
  $('sheet').querySelectorAll('[data-bk]').forEach(b=>b.onclick=()=>open(l[+b.dataset.bk].data));
}
